name: Build Android APK

# Builds the release APK on a GitHub-hosted runner (which has the Android
# SDK preinstalled). This exists because the sandbox this app was
# originally developed in has no Android SDK and blocks the domain
# (dl.google.com) that ships it - see README.md "Building the APK". CI is
# the reliable way to get a real, installable APK without every
# contributor needing a full Android Studio setup.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitflow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
